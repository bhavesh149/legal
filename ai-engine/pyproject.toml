[project]
name = "legal-ai-engine"
version = "0.1.0"
description = "Isolated Python AI microservice for The Private Legal Agent: document parsing, RAG-grounded contract risk analysis, and conversational Q&A."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "arq>=0.26.1",
    "redis>=5.1.1",
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.2",
    "boto3>=1.35.0",
    "pymupdf4llm>=0.0.17",
    "pymupdf>=1.24.11",
    "openai>=1.54.0",
    "instructor>=1.6.4",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "httpx>=0.27.2",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.3",
    "orjson>=3.10.10",
]

[project.optional-dependencies]
pii = [
    "presidio-analyzer>=2.2.355",
    "spacy>=3.7.5",
]
ocr = [
    "ocrmypdf>=16.5.0",
]
dev = [
    "ruff>=0.7.2",
    "mypy>=1.13.0",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.1",
    "fakeredis>=2.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_ai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
# B008: FastAPI's Depends()/File()/Form() in argument defaults is the required, idiomatic pattern.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
